<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SESI 4</title>
</head>
<body>
    <img src="assets/image/off.gif" alt="" id="lampu1" />
    <h1>CETREKAN LAMPU ON OFF BRO</h1>
    <button onclick="saklar('on')">NYALAKAN LAMPU</button>
    <button onclick="saklar('off')">MATIKAN LAMPU</button>

    <!-- ini adalah script js kita -->
    <script>
        function saklar(params) {
            console.log(params);

            let lampu1 = document.getElementById("lampu1");

            if(params == "on") {
                lampu1.src = "assets/image/on.gif";
            }
            if(params == "off") {
                lampu1.src = "assets/image/off.gif";
            }
            return lampu1;
        }
    </script>
</body>
</html>
